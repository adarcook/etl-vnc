# This is a SecretProviderClass example using workload identity to access Key Vault
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: secretproviderclassvnc
  namespace: {{ .Values.namespace }}    
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"         # set to true for pod identity access mode
    useVMManagedIdentity: "true"
    userAssignedIdentityID: {{ .Values.userAssignedIdentityID | quote }} # managed identity client ID
    keyvaultName: {{ .Values.KeyVaultName }} # name of the KeyVault
    cloudName: ""                   # [OPTIONAL for Azure] if not provided, azure environment will default to AzurePublicCloud
    objects:  |
      array:
        - |
          objectName: vnc-archive-sas
          objectType: secret        # object types: secret, key or cert
          objectVersion: ""         # [OPTIONAL] object versions, default to latest if empty
        - |
          objectName: vnc-csv-sas
          objectType: secret        # object types: secret, key or cert
          objectVersion: ""         # [OPTIONAL] object versions, default to latest if empty      
    tenantID: "e741d71c-c6b6-47b0-803c-0f3b32b07556"                    # the tenant ID of the KeyVault
  secretObjects:                      # Add this section
  - secretName: vnc-secret  # Name of the Kubernetes secret
    type: Opaque
    data:
      - objectName: vnc-csv-sas     # Matches the objectName in the Key Vault
        key: vnc-csv-sas
      - objectName: vnc-archive-sas    # Matches the objectName in the Key Vault
        key: vnc-archive-sas